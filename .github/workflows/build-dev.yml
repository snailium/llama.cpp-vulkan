name: Build Dev (dev branch)

on:
  schedule:
    # Weekly dev build on Saturdays 00:00 UTC
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a dev build even if this version combo already exists in GHCR'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-and-build-dev:
    # Only run on dev branch (schedule or manual)
    if: |
      github.ref_name == 'dev' ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      - name: Checkout repository (dev)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # Dev branch logic: track the newest llama.cpp tag (v* or b*),
      # but skip when the newest tag is a release (v*) — those are the
      # stable workflow's job. On dev we want the bleeding edge (b* tags)
      # so regressions surface before they ship as stable.
      # ============================================================
      - name: "Detect latest llama.cpp tag (dev: prefer b*, skip pure v* releases)"
        id: llama
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git 2>/dev/null || true
          git fetch upstream --tags --force
          LATEST_V=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | grep -E '^v[0-9]' | head -1)
          LATEST_B=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | grep -E '^b[0-9]' | head -1 || true)
          echo "latest_v=$LATEST_V" >> $GITHUB_OUTPUT
          echo "latest_b=${LATEST_B:-none}" >> $GITHUB_OUTPUT
          echo "Latest upstream v*: $LATEST_V ; b*: ${LATEST_B:-none}"

      - name: Detect latest Mesa release (kisak-mesa PPA index)
        id: mesa
        run: |
          set -e
          UBUNTU="${{ vars.UBUNTU_VERSION }}"
          [ -n "$UBUNTU" ] || { echo "ERR: repo variable UBUNTU_VERSION is not set" >&2; exit 1; }
          # The PPA dists index is keyed by Ubuntu series codename (resolute, noble),
          # not the numeric version. Resolve via /etc/os-release in a throwaway
          # container of the exact base image the Dockerfile builds on.
          CODE=$(docker run --rm "ubuntu:${UBUNTU}" cat /etc/os-release | awk -F= '/^VERSION_CODENAME/{print $2}')
          [ -n "$CODE" ] || { echo "ERR: could not resolve codename for ubuntu:${UBUNTU}" >&2; exit 1; }
          # Fetch the PPA index and extract mesa-vulkan-drivers. If the series'
          # amd64 index is empty or lacks the package (kisak has only *preliminary*
          # support for brand-new Ubuntu series), fall back to the newest fully
          # supported LTS index: kisak builds one Mesa source package per release,
          # so that version is the current upstream Mesa point release. The
          # Dockerfile pin-check still gates the actually-installed driver.
          fetch_mesa() {
            curl -sf "http://ppa.launchpad.net/kisak/kisak-mesa/ubuntu/dists/$1/main/binary-amd64/Packages" \
              | awk '/^Package: mesa-vulkan-drivers/{f=1; next} f && /^Version:/{print $2; exit}'
          }
          MESA=$(fetch_mesa "$CODE")
          if [ -z "$MESA" ]; then
            echo "WARN: kisak-mesa PPA index for ${CODE} has no mesa-vulkan-drivers (preliminary series support); falling back to noble"
            MESA=$(fetch_mesa "noble")
            CODE="noble (fallback)"
          fi
          [ -n "$MESA" ] || { echo "ERR: failed to detect Mesa in kisak-mesa PPA (series ${CODE})" >&2; exit 1; }
          # Trim to major.minor - point releases must not gate the build.
          MESA=$(echo "$MESA" | cut -d. -f1-2)
          echo "latest_mesa=$MESA" >> $GITHUB_OUTPUT
          echo "Latest Mesa (kisak-mesa PPA, ${CODE}): $MESA"

      - name: Decide if build is needed (skip if this combo already built)
        id: decide
        run: |
          set -e
          REPO="${{ github.repository }}/llama-vulkan"
          # Dev builds track the newest b* tag when one exists; otherwise the
          # newest v* tag (a fresh release that stable hasn't picked up yet).
          if [ "${{ steps.llama.outputs.latest_b }}" != "none" ]; then
            REF="${{ steps.llama.outputs.latest_b }}"
          else
            REF="${{ steps.llama.outputs.latest_v }}"
          fi
          PREFIX="server-dev-m${{ steps.mesa.outputs.latest_mesa }}-${REF}-"
          SHOULD_BUILD=false
          REASON=""
          FORCE="${{ github.event.inputs.force || 'false' }}"

          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r .token)
          TAGS=$(curl -s -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/${REPO}/tags/list" | jq -r '.tags[]? // empty' || true)

          if [ -z "$TOKEN" ]; then
            REASON="GHCR auth failed - skipped (will re-check next run)"
          elif echo "$TAGS" | grep -qF "$PREFIX"; then
            REASON="Already built ${PREFIX%?} in GHCR - skipping redundant rebuild"
          else
            SHOULD_BUILD=true
            REASON="New dev stack: Mesa ${{ steps.mesa.outputs.latest_mesa }} + llama.cpp $REF"
          fi

          if [ "$FORCE" == "true" ]; then
            SHOULD_BUILD=true
            REASON="Forced by manual dispatch (force=true)"
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "build_reason=$REASON"
          echo "ref_used=$REF" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh llama.cpp subtree at dev ref
        if: steps.decide.outputs.should_build == 'true'
        run: |
          rm -rf llama.cpp
          git clone --depth 1 --branch "${{ steps.decide.outputs.ref_used }}" https://github.com/ggml-org/llama.cpp llama.cpp

      - name: Compute temporary dev tag
        if: steps.decide.outputs.should_build == 'true'
        id: tag
        run: |
          TAG="server-dev-m${{ steps.mesa.outputs.latest_mesa }}-${{ steps.decide.outputs.ref_used }}-$(date +%Y%m%d-%H%M)"
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=ghcr.io/${{ github.repository }}/llama-vulkan:${TAG}" >> $GITHUB_OUTPUT
          echo "Using temporary tag: $TAG"

      - name: Build and push (dev candidate)
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/vulkan.Dockerfile
          target: server
          push: true
          tags: ghcr.io/${{ github.repository }}/llama-vulkan:${{ steps.tag.outputs.image_tag }}
          build-args: |
            UBUNTU_VERSION=26.04
            MESA_PPA=kisak/kisak-mesa
            MESA_VERSION=${{ steps.mesa.outputs.latest_mesa }}
            BUILD_WEBUI=0
            GGML_VULKAN=ON
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Issue with diff (dev)
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.image_tag }}';
            const full = '${{ steps.tag.outputs.full_image }}';
            const ref = '${{ steps.decide.outputs.ref_used }}';
            const mesa = '${{ steps.mesa.outputs.latest_mesa }}';

            let diff = `**Dev candidate build (Vulkan, dual-target B70 + 7900 XTX)**\n\n`;
            diff += `**Image**: \`${full}\`\n`;
            diff += `**llama.cpp ref**: ${ref}\n`;
            diff += `**Mesa reference pin**: ${mesa} (installed via kisak-mesa PPA)\n`;
            diff += `**Build**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;
            diff += `### Next steps (on your hardware)\n`;
            diff += `1. Pull: \`docker pull ${full}\`\n`;
            diff += `2. Smoke-test on B70 and/or 7900 XTX (offload line + T1 single-shot)\n`;
            diff += `3. If promising, run the full T1-T5 suite before any promote\n\n`;
            diff += `Reason: ${{ steps.decide.outputs.build_reason }}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Vulkan Dev Image Ready: ${tag}`,
              body: diff,
              labels: ['dev', 'vulkan']
            });
