name: Make GHCR packages public

on:
  workflow_dispatch:

jobs:
  make-public:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Set container package visibility to public (llama-vulkan)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for PKG in "llama.cpp-vulkan%2Fllama-vulkan"; do
            echo "Patching ${PKG} -> public"
            curl -sS -o /tmp/patch.json -w "HTTP %{http_code}\n" \
              -X PATCH \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/${PKG}" \
              -d '{"visibility":"public"}'
            head -c 400 /tmp/patch.json; echo
          done