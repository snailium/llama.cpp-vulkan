<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <!-- 背景星空渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1a2340"/>
      <stop offset="60%" stop-color="#0d1226"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>

    <!-- 奇点核心光晕 -->
    <radialGradient id="singularity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fff2b0"/>
      <stop offset="70%" stop-color="#ff9e4a"/>
      <stop offset="100%" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>

    <!-- 膨胀火球 -->
    <radialGradient id="fireball" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c9"/>
      <stop offset="40%" stop-color="#ffb347"/>
      <stop offset="75%" stop-color="#ff5e3a"/>
      <stop offset="100%" stop-color="#b8240f" stop-opacity="0.15"/>
    </radialGradient>

    <!-- 核合成 -->
    <radialGradient id="nucleosynthesis" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#ffcf5c"/>
      <stop offset="80%" stop-color="#e8722a"/>
      <stop offset="100%" stop-color="#7a2d0c" stop-opacity="0.1"/>
    </radialGradient>

    <!-- 复合期 / CMB -->
    <radialGradient id="cmb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4d9a8"/>
      <stop offset="50%" stop-color="#c98a4e"/>
      <stop offset="100%" stop-color="#3a2410" stop-opacity="0.1"/>
    </radialGradient>

    <!-- 星系 -->
    <radialGradient id="galaxy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e6"/>
      <stop offset="40%" stop-color="#ffd98a"/>
      <stop offset="75%" stop-color="#8ab0ff"/>
      <stop offset="100%" stop-color="#2b3d7a" stop-opacity="0"/>
    </radialGradient>

    <!-- 箭头 -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fd4ff"/>
    </marker>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 背景星星（可复用） -->
    <g id="stars">
      <circle cx="60" cy="80" r="1.4" fill="#ffffff" opacity="0.8"/>
      <circle cx="200" cy="50" r="1" fill="#cfe6ff" opacity="0.6"/>
      <circle cx="340" cy="120" r="1.6" fill="#ffffff" opacity="0.9"/>
      <circle cx="520" cy="70" r="1.1" fill="#ffe9c9" opacity="0.7"/>
      <circle cx="700" cy="40" r="1.3" fill="#ffffff" opacity="0.8"/>
      <circle cx="880" cy="110" r="1" fill="#cfe6ff" opacity="0.5"/>
      <circle cx="1050" cy="60" r="1.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="1220" cy="130" r="1.2" fill="#ffe9c9" opacity="0.7"/>
      <circle cx="1340" cy="70" r="1.4" fill="#ffffff" opacity="0.8"/>
      <circle cx="120" cy="740" r="1.3" fill="#cfe6ff" opacity="0.6"/>
      <circle cx="400" cy="760" r="1.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="900" cy="750" r="1.1" fill="#ffe9c9" opacity="0.6"/>
      <circle cx="1250" cy="730" r="1.4" fill="#ffffff" opacity="0.8"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="1400" height="800" fill="url(#bgGrad)"/>
  <use href="#stars"/>

  <!-- 标题 -->
  <text x="700" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#ffffff">宇宙大爆炸理论</text>
  <text x="700" y="82" text-anchor="middle" font-size="16" fill="#9fb8e0">The Big Bang Theory · 从奇点到星系的演化历程</text>

  <!-- 时间轴主线 -->
  <line x1="80" y1="430" x2="1320" y2="430" stroke="#3a5b8c" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="80" y1="430" x2="1320" y2="430" stroke="#7fd4ff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.9"/>
  <text x="1330" y="435" font-size="14" fill="#7fd4ff">时间 →</text>

  <!-- ========== 阶段 1：奇点 ========== -->
  <g>
    <circle cx="200" cy="430" r="60" fill="url(#singularity)" filter="url(#glow)"/>
    <circle cx="200" cy="430" r="14" fill="#ffffff"/>
    <!-- 标签 -->
    <text x="200" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffd98a">① 奇点</text>
    <text x="200" y="540" text-anchor="middle" font-size="14" fill="#cfe6ff">约 138 亿年前</text>
    <text x="200" y="562" text-anchor="middle" font-size="13" fill="#9fb8e0">宇宙所有物质与能量</text>
    <text x="200" y="582" text-anchor="middle" font-size="13" fill="#9fb8e0">集中于一个无限致密的点</text>
  </g>

  <!-- ========== 阶段 2：膨胀冷却 ========== -->
  <g>
    <circle cx="440" cy="430" r="85" fill="url(#fireball)" opacity="0.9"/>
    <!-- 向外扩散的波纹 -->
    <circle cx="440" cy="430" r="105" fill="none" stroke="#ff8a4a" stroke-width="2" opacity="0.6"/>
    <circle cx="440" cy="430" r="125" fill="none" stroke="#ff8a4a" stroke-width="1.5" opacity="0.4"/>
    <!-- 向外箭头表示膨胀 -->
    <line x1="440" y1="330" x2="440" y2="300" stroke="#7fd4ff" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="540" y1="430" x2="570" y2="430" stroke="#7fd4ff" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="340" y1="430" x2="310" y2="430" stroke="#7fd4ff" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- 标签 -->
    <text x="440" y="300" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffb36b">② 膨胀冷却</text>
    <text x="440" y="580" text-anchor="middle" font-size="14" fill="#cfe6ff">极早期 (秒级)</text>
    <text x="440" y="602" text-anchor="middle" font-size="13" fill="#9fb8e0">空间迅速膨胀，温度极高</text>
    <text x="440" y="622" text-anchor="middle" font-size="13" fill="#9fb8e0">基本粒子与反粒子产生</text>
  </g>

  <!-- ========== 阶段 3：原初核合成 ========== -->
  <g>
    <circle cx="700" cy="430" r="80" fill="url(#nucleosynthesis)" opacity="0.9"/>
    <!-- 原子核符号 -->
    <g transform="translate(700,430)">
      <circle cx="-12" cy="0" r="6" fill="#fff3c4"/>
      <circle cx="8" cy="-6" r="6" fill="#ffcf5c"/>
      <circle cx="8" cy="8" r="6" fill="#ffcf5c"/>
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    </g>
    <!-- 标签 -->
    <text x="700" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffcf5c">③ 原初核合成</text>
    <text x="700" y="540" text-anchor="middle" font-size="14" fill="#cfe6ff">约 3 分钟后</text>
    <text x="700" y="562" text-anchor="middle" font-size="13" fill="#9fb8e0">质子与中子结合成原子核</text>
    <text x="700" y="582" text-anchor="middle" font-size="13" fill="#9fb8e0">形成氢、氦等轻元素</text>
  </g>

  <!-- ========== 阶段 4：复合期与 CMB ========== -->
  <g>
    <circle cx="960" cy="430" r="75" fill="url(#cmb)" opacity="0.85"/>
    <!-- CMB 微波波纹 -->
    <path d="M920,410 q20,-12 40,0 t40,0" fill="none" stroke="#f4d9a8" stroke-width="1.5" opacity="0.7"/>
    <path d="M920,430 q20,-12 40,0 t40,0" fill="none" stroke="#c98a4e" stroke-width="1.5" opacity="0.6"/>
    <path d="M920,450 q20,-12 40,0 t40,0" fill="none" stroke="#f4d9a8" stroke-width="1.5" opacity="0.5"/>
    <!-- 标签 -->
    <text x="960" y="340" text-anchor="middle" font-size="20" font-weight="bold" fill="#e8c08a">④ 复合期 / CMB</text>
    <text x="960" y="535" text-anchor="middle" font-size="14" fill="#cfe6ff">约 38 万年后</text>
    <text x="960" y="557" text-anchor="middle" font-size="13" fill="#9fb8e0">电子与原子核结合成中性原子</text>
    <text x="960" y="577" text-anchor="middle" font-size="13" fill="#9fb8e0">光子自由传播，形成宇宙微波背景辐射</text>
  </g>

  <!-- ========== 阶段 5：星系形成 ========== -->
  <g>
    <circle cx="1200" cy="430" r="70" fill="url(#galaxy)" filter="url(#glow)"/>
    <!-- 螺旋臂示意 -->
    <path d="M1200,430 q30,-15 45,10 q10,25 -15,35" fill="none" stroke="#ffd98a" stroke-width="2" opacity="0.7"/>
    <path d="M1200,430 q-30,15 -45,-10 q-10,-25 15,-35" fill="none" stroke="#8ab0ff" stroke-width="2" opacity="0.7"/>
    <!-- 周围小星系 -->
    <circle cx="1140" cy="370" r="6" fill="url(#galaxy)"/>
    <circle cx="1265" cy="490" r="5" fill="url(#galaxy)"/>
    <circle cx="1160" cy="490" r="4" fill="#8ab0ff" opacity="0.8"/>
    <!-- 标签 -->
    <text x="1200" y="340" text-anchor="middle" font-size="20" font-weight="bold" fill="#bcd0ff">⑤ 星系形成</text>
    <text x="1200" y="535" text-anchor="middle" font-size="14" fill="#cfe6ff">数亿年后至今</text>
    <text x="1200" y="557" text-anchor="middle" font-size="13" fill="#9fb8e0">引力使气体聚集，点燃恒星</text>
    <text x="1200" y="577" text-anchor="middle" font-size="13" fill="#9fb8e0">形成星系、星团与宇宙大尺度结构</text>
  </g>

  <!-- 底部说明 -->
  <rect x="80" y="680" width="1240" height="70" rx="10" fill="#101a35" opacity="0.7"/>
  <text x="100" y="710" font-size="15" fill="#cfe6ff">核心观点：宇宙并非在空间中爆炸，而是空间本身从极热、极密的状态不断膨胀与冷却，</text>
  <text x="100" y="734" font-size="15" fill="#cfe6ff">由此逐步形成粒子、原子、恒星与星系。关键证据包括：宇宙红移（哈勃定律）、宇宙微波背景辐射（CMB）以及轻元素的丰度。</text>
</svg>
