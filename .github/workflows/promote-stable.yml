name: Promote Vulkan stable tag

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Source candidate tag to promote to :stable
        required: true
        default: server-m26.2-v0.4.0-20260909-2255
      semver_tag:
        description: 'Optional extra version tag (e.g. v0.6.0). Leave blank to only move :stable.'
        required: false
        default: ''

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create :stable and :latest manifests
        run: |
          SRC="ghcr.io/snailium/llama.cpp-vulkan/llama-vulkan:${{ inputs.source_tag }}"
          # :latest is promoted in the SAME step as :stable, deliberately.
          # It used to be maintained by hand and drifted: on 2026-10-17 :latest
          # still pointed at 0.5.0-dev (b11165) while :stable was 0.6.0, because
          # nothing in CI ever touched it. Anything pinning :latest - the
          # Portainer stack does - was running a two-release-old binary. Moving
          # both here means the two floating tags cannot disagree.
          for TAG in stable latest; do
            DST="ghcr.io/snailium/llama.cpp-vulkan/llama-vulkan:$TAG"
            docker buildx imagetools create --tag "$DST" "$SRC"
            docker buildx imagetools inspect "$DST" --format "$TAG -> {{.Name}}"
          done
      - name: Create optional version tag
        if: inputs.semver_tag != ''
        run: |
          SRC="ghcr.io/snailium/llama.cpp-vulkan/llama-vulkan:${{ inputs.source_tag }}"
          DST="ghcr.io/snailium/llama.cpp-vulkan/llama-vulkan:${{ inputs.semver_tag }}"
          docker buildx imagetools create --tag "$DST" "$SRC"
          docker buildx imagetools inspect "$DST" --format "${{ inputs.semver_tag }} -> {{.Name}}"
      - name: Verify all promoted tags resolve to one digest
        run: |
          SRC="ghcr.io/snailium/llama.cpp-vulkan/llama-vulkan:${{ inputs.source_tag }}"
          want=$(docker buildx imagetools inspect "$SRC" --format '{{.Manifest.Digest}}')
          # `latest` is in this list so a drift like the 2026-10-17 one fails the
          # run instead of going unnoticed for two releases.
          for t in stable latest ${{ inputs.semver_tag }}; do
            [ -z "$t" ] && continue
            got=$(docker buildx imagetools inspect "ghcr.io/snailium/llama.cpp-vulkan/llama-vulkan:$t" --format '{{.Manifest.Digest}}')
            if [ "$got" != "$want" ]; then
              echo "ERR: :$t -> $got, expected $want" >&2; exit 1
            fi
            echo "OK :$t -> $got"
          done