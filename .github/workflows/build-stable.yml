name: Build Stable (main)

on:
  schedule:
    # Every 4 hours: check llama.cpp tags + Mesa releases for updates
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a stable build even if this version combo already exists in GHCR'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-and-build-stable:
    # Only run on main branch (schedule or manual)
    if: |
      github.ref_name == 'main' ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write

    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # Detect latest llama.cpp stable tag.
      # ============================================================
      - name: Detect latest llama.cpp stable tag
        id: llama
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git 2>/dev/null || true
          git fetch upstream --tags --force
          LATEST_V=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | grep -E '^v[0-9]' | head -1)
          V_DATE=$(git for-each-ref --format='%(creatordate:iso8601)' "refs/tags/$LATEST_V")
          echo "latest_v=$LATEST_V" >> $GITHUB_OUTPUT
          echo "v_date=$V_DATE" >> $GITHUB_OUTPUT
          echo "Latest upstream stable: $LATEST_V"

      # ============================================================
      # Detect the latest Mesa version (the single source of truth for the
      # ANV/RADV ICDs - the B70 decode lever lives here, not in llama.cpp).
      # Source: the kisak-mesa PPA's apt index for this image's Ubuntu series.
      # That is exactly what the Dockerfile base stage installs, so the pin we
      # compute here can never demand a version the PPA does not ship. (Mesa's
      # upstream repo lives on gitlab.freedesktop.org and its GitHub org no
      # longer hosts the source - the old releases/latest API 404s.)
      # MESA_VERSION stays a major.minor reference pin: point releases
      # (26.2.2) do not gate the build, but the base stage FAILS if the
      # installed mesa-vulkan-drivers is below it.
      # ============================================================
      - name: Detect latest Mesa release (kisak-mesa PPA index)
        id: mesa
        run: |
          set -e
          UBUNTU="${{ vars.UBUNTU_VERSION }}"
          [ -n "$UBUNTU" ] || { echo "ERR: repo variable UBUNTU_VERSION is not set" >&2; exit 1; }
          # The PPA dists index is keyed by Ubuntu series codename (resolute, noble),
          # not the numeric version. Resolve via /etc/os-release in a throwaway
          # container of the exact base image the Dockerfile builds on.
          CODE=$(docker run --rm "ubuntu:${UBUNTU}" cat /etc/os-release | awk -F= '/^VERSION_CODENAME/{print $2}')
          [ -n "$CODE" ] || { echo "ERR: could not resolve codename for ubuntu:${UBUNTU}" >&2; exit 1; }
          # Fetch the PPA index and extract mesa-vulkan-drivers. If the series'
          # amd64 index is empty or lacks the package (kisak has only *preliminary*
          # support for brand-new Ubuntu series), fall back to the newest fully
          # supported LTS index: kisak builds one Mesa source package per release,
          # so that version is the current upstream Mesa point release. The
          # Dockerfile pin-check still gates the actually-installed driver.
          fetch_mesa() {
            curl -sf "http://ppa.launchpad.net/kisak/kisak-mesa/ubuntu/dists/$1/main/binary-amd64/Packages" \
              | awk '/^Package: mesa-vulkan-drivers/{f=1; next} f && /^Version:/{print $2; exit}'
          }
          MESA=$(fetch_mesa "$CODE")
          if [ -z "$MESA" ]; then
            echo "WARN: kisak-mesa PPA index for ${CODE} has no mesa-vulkan-drivers (preliminary series support); falling back to noble"
            MESA=$(fetch_mesa "noble")
            CODE="noble (fallback)"
          fi
          [ -n "$MESA" ] || { echo "ERR: failed to detect Mesa in kisak-mesa PPA (series ${CODE})" >&2; exit 1; }
          # Trim to major.minor - point releases must not gate the build.
          MESA=$(echo "$MESA" | cut -d. -f1-2)
          echo "latest_mesa=$MESA" >> $GITHUB_OUTPUT
          echo "Latest Mesa (kisak-mesa PPA, ${CODE}): $MESA"

      # ============================================================
      # Decide: skip if this exact version combo is already built.
      # The image tag embeds the version fingerprint (server-m<Mesa>-<llama>-),
      # so check GHCR for a tag with that prefix. A new Mesa or llama.cpp
      # tag changes the prefix, so this check auto-covers updates too.
      # ============================================================
      - name: Decide if build is needed (skip if this combo already built)
        id: decide
        run: |
          set -e
          REPO="${{ github.repository }}/llama-vulkan"
          PREFIX="server-m${{ steps.mesa.outputs.latest_mesa }}-${{ steps.llama.outputs.latest_v }}-"
          SHOULD_BUILD=false
          REASON=""
          FORCE="${{ github.event.inputs.force || 'false' }}"

          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r .token)
          TAGS=$(curl -s -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/${REPO}/tags/list" | jq -r '.tags[]? // empty' || true)

          if [ -z "$TOKEN" ]; then
            # registry check inconclusive -> fail closed to avoid a duplicate build
            REASON="GHCR auth failed - skipped (will re-check next run)"
          elif echo "$TAGS" | grep -qF "$PREFIX"; then
            REASON="Already built ${PREFIX%?} in GHCR - skipping redundant rebuild"
          else
            SHOULD_BUILD=true
            MESA_CUR=$(grep '^ARG MESA_VERSION=' .devops/vulkan.Dockerfile | head -1 | cut -d= -f2)
            REASON="New stack: Mesa ${{ steps.mesa.outputs.latest_mesa }} + llama.cpp ${{ steps.llama.outputs.latest_v }} (Dockerfile pin $MESA_CUR)"
          fi

          if [ "$FORCE" == "true" ]; then
            SHOULD_BUILD=true
            REASON="Forced by manual dispatch (force=true)"
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "build_reason=$REASON"

      # ============================================================
      # Build stage
      # ============================================================
      - name: Set up Docker Buildx
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh llama.cpp subtree at latest stable v tag
        if: steps.decide.outputs.should_build == 'true'
        run: |
          rm -rf llama.cpp
          git clone --depth 1 --branch "${{ steps.llama.outputs.latest_v }}" https://github.com/ggml-org/llama.cpp llama.cpp

      - name: Compute temporary stable tag
        if: steps.decide.outputs.should_build == 'true'
        id: tag
        run: |
          TAG="server-m${{ steps.mesa.outputs.latest_mesa }}-${{ steps.llama.outputs.latest_v }}-$(date +%Y%m%d-%H%M)"
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "full_image=ghcr.io/${{ github.repository }}/llama-vulkan:${TAG}" >> $GITHUB_OUTPUT
          echo "Using temporary tag: $TAG"

      - name: Build and push (stable candidate)
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/vulkan.Dockerfile
          target: server
          push: true
          tags: ghcr.io/${{ github.repository }}/llama-vulkan:${{ steps.tag.outputs.image_tag }}
          build-args: |
            UBUNTU_VERSION=26.04
            MESA_PPA=kisak/kisak-mesa
            MESA_VERSION=${{ steps.mesa.outputs.latest_mesa }}
            BUILD_WEBUI=0
            GGML_VULKAN=ON
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Issue with diff (stable)
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.image_tag }}';
            const full = '${{ steps.tag.outputs.full_image }}';
            const v = '${{ steps.llama.outputs.latest_v }}';
            const mesa = '${{ steps.mesa.outputs.latest_mesa }}';

            let diff = `**Stable candidate build (Vulkan, dual-target B70 + 7900 XTX)**\n\n`;
            diff += `**Image**: \`${full}\`\n`;
            diff += `**llama.cpp**: ${v}\n`;
            diff += `**Mesa reference pin**: ${mesa} (installed via kisak-mesa PPA; build fails if older)\n`;
            diff += `**Build**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;
            diff += `### Next steps (on your hardware)\n`;
            diff += `1. Pull: \`docker pull ${full}\`\n`;
            diff += `2. Run the T1-T5 suite on B70 (\`examples/b70-server.sh\`) and/or 7900 XTX (\`examples/7900xtx-server.sh\`)\n`;
            diff += `3. Verify the offload line (n_gpu_layers) before trusting any number\n`;
            diff += `4. If good, promote via \`scripts/promote-vulkan-image.sh <digest> vX.Y\`\n\n`;
            diff += `Reason: ${{ steps.decide.outputs.build_reason }}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Vulkan Stable Image Ready: ${tag}`,
              body: diff,
              labels: ['stable', 'vulkan']
            });
